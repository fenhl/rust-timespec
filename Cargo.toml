[package]
name = "timespec"
version = "6.0.0"
authors = ["Fenhl <fenhl@fenhl.net>"]
edition = "2024"
rust-version = "1.95" # nixpkgs stable

[profile.release]
codegen-units = 1
lto = true
strip = true

[lib]
name = "timespec"
path = "src/lib.rs"

[[bin]]
name = "timespec"
path = "src/main.rs"
doc = false

[[bin]]
name = "sleeptill"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "1"
lazy-regex = "3"
shlex = "2"
thiserror = "2"
wheel = { git = "https://github.com/fenhl/wheel" }
